# Render Blueprint: Render reads this file from GitHub and creates the web service for you.
services:
  - type: web
    name: farm-database
    runtime: node
    region: frankfurt            # closest Render region to the Netherlands (change if you prefer)
    plan: free                   # free = sleeps after ~15 min without visits (first visit then takes ~1 min); use a paid plan for always-on
    buildCommand: npm install --omit=dev && npm run prepare-ui
    startCommand: node server/cloud.js
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI        # MongoDB Atlas connection string - you paste it in the Render dashboard
        sync: false
      - key: ADMIN_USERNAME     # first manager account (only used while no user exists)
        sync: false
      - key: ADMIN_PASSWORD     # at least 10 characters; you may delete this variable after the first start
        sync: false
      - key: DB_NAME
        value: farm_database
      - key: SESSION_SECRET     # generated by Render
        generateValue: true
